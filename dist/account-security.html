<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Account Security · jlijano-mdm</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/users.css"><script defer src="/account-security.js"></script></head><body><main class="security-layout card"><div class="section-heading"><h1>Account Security</h1><button id="security-logout">Sign Out</button></div><p id="security-state" role="status">Checking account…</p><p id="security-error" role="alert" hidden></p><section id="password-section" hidden><h2>Change your temporary password</h2><form id="password-form"><label>Current Password<input name="current_password" type="password" autocomplete="current-password" required maxlength="256"></label><label>New Password<input name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></label><label>Confirm New Password<input name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></label><button class="primary">Change Password</button></form></section><section id="mfa-section" hidden><h2 id="mfa-title">Verify your authenticator</h2><div id="mfa-setup" hidden><p>Add an account in your authenticator app using this setup key.</p><code id="mfa-secret"></code><p><a id="mfa-uri">Open Authenticator</a></p><p class="small">Keep this key private. Enter the six-digit code shown by your authenticator to finish enrollment.</p></div><form id="mfa-form"><label>Authenticator Code<input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="primary">Verify Code</button></form></section><button id="continue-dashboard" class="primary" hidden>Continue to Dashboard</button></main></body></html>
